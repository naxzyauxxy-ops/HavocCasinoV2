# ============================================================
#  HavocCasino  •  ProGuard configuration
#  Aggressive name obfuscation + control-flow noise so the
#  decompiled output is hard to read. (Nothing can make JVM
#  bytecode impossible to decompile — this just makes it ugly.)
# ============================================================

# Bukkit reads these via reflection/annotations, so keep the metadata.
-keepattributes *Annotation*, Signature, InnerClasses, EnclosingMethod

# The server instantiates the main class named in plugin.yml — keep it intact.
-keep public class net.havoccasino.HavocCasino {
    public <init>(...);
    public *;
}

# Any JavaPlugin subclass is loaded by name; never rename it.
-keep public class * extends org.bukkit.plugin.java.JavaPlugin {
    public <init>(...);
    public *;
}

# Event methods are dispatched reflectively by the Bukkit event bus.
-keepclassmembers class * implements org.bukkit.event.Listener {
    @org.bukkit.event.EventHandler <methods>;
}

# Enum plumbing is used by config parsing and serialization.
-keepclassmembers enum * {
    public static **[] values();
    public static ** valueOf(java.lang.String);
}

# InventoryHolder implementations are matched by type at runtime to identify our GUIs.
-keep class net.havoccasino.gui.SlotHolder { *; }
-keep class net.havoccasino.gui.MinesHolder { *; }
-keep class net.havoccasino.gui.SettingsHolder { *; }
-keep class net.havoccasino.gui.CrateHolder { *; }

# PlaceholderAPI loads the expansion and calls its overrides by name.
-keep class * extends me.clip.placeholderapi.expansion.PlaceholderExpansion { *; }

# ---- Obfuscation aggressiveness ----
-repackageclasses 'net.havoccasino.a'
-flattenpackagehierarchy 'net.havoccasino'
-allowaccessmodification
-mergeinterfacesaggressively
-optimizationpasses 5
-useuniqueclassmembernames

# Strip original file names from stack traces; keep line numbers usable.
-renamesourcefileattribute SourceFile
-keepattributes SourceFile,LineNumberTable

# The runtime/libraries are provided by the server — silence resolution noise.
-dontwarn org.bukkit.**
-dontwarn io.papermc.**
-dontwarn net.kyori.**
-dontwarn net.milkbowl.**
-dontwarn me.clip.**
-dontwarn org.jetbrains.**
-dontwarn com.google.**
-dontnote **
